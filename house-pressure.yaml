substitutions:
  name: house-pressure
  friendly_name: Husets tryck

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# Waveshare ESP32-C3-Zero (ESP32-C3FH4, 4 MB flash, native USB Serial/JTAG)
esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"
    password: !secret fallback_ap_password

captive_portal:

# GPIO4/5: free on the C3-Zero (not strapping 2/8/9, not LED 10, not USB 18/19, not UART 20/21).
# External 4.7 kΩ pull-ups to 3.3 V, so internal pull-ups are off.
i2c:
  sda: GPIO4
  scl: GPIO5
  sda_pullup_enabled: false
  scl_pullup_enabled: false
  frequency: 100kHz
  scan: true

# Positive = "+" port (indoor) higher than "−" port (outdoor).
# Turn on if the tubes are swapped.
switch:
  - platform: template
    id: invert_sign
    name: "Tryck invertera tecken"
    icon: mdi:swap-vertical
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # Offset is stored in the displayed sign convention, so flip it with the sign.
    on_turn_on:
      - number.set:
          id: pressure_offset
          value: !lambda return -id(pressure_offset).state;
    on_turn_off:
      - number.set:
          id: pressure_offset
          value: !lambda return -id(pressure_offset).state;

number:
  - platform: template
    id: pressure_offset
    name: "Tryck offset"
    icon: mdi:tune-vertical
    entity_category: config
    unit_of_measurement: Pa
    device_class: pressure
    mode: box
    min_value: -25
    max_value: 25
    step: 0.01
    initial_value: 0
    optimistic: true
    restore_value: true

button:
  - platform: template
    name: "Nollkalibrera"
    icon: mdi:scale-balance
    entity_category: config
    on_press:
      - lambda: |-
          float avg = id(pressure_avg).state;
          if (std::isnan(avg)) {
            ESP_LOGW("calib", "No average yet, calibration skipped");
            return;
          }
          // avg already has the old offset subtracted
          float offset = id(pressure_offset).state + avg;
          ESP_LOGI("calib", "New offset: %.2f Pa", offset);
          auto call = id(pressure_offset).make_call();
          call.set_value(offset);
          call.perform();

sensor:
  # sdp3x publishes hPa; convert to Pa. Sign/offset are applied on the outputs.
  - platform: sdp3x
    id: sdp_pa
    address: 0x25
    update_interval: 2s
    internal: true
    unit_of_measurement: Pa
    accuracy_decimals: 2
    filters:
      - multiply: 100

  - platform: copy
    source_id: sdp_pa
    id: pressure_raw
    name: "Tryck inne-ute rå"
    unit_of_measurement: Pa
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - throttle_average: 10s
      - lambda: |-
          return (id(invert_sign).state ? -x : x) - id(pressure_offset).state;

  - platform: copy
    source_id: sdp_pa
    id: pressure_avg
    name: "Tryck inne-ute"
    unit_of_measurement: Pa
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    filters:
      # 150 × 2 s = 5 min window, published every 30 s
      - sliding_window_moving_average:
          window_size: 150
          send_every: 15
          send_first_at: 15
      - lambda: |-
          return (id(invert_sign).state ? -x : x) - id(pressure_offset).state;

  - platform: wifi_signal
    name: "WiFi-signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Upptid"
    entity_category: diagnostic
